# 1C:Enterprise Catalog, the free edition of the 1C:Enterprise integration, authored by Gorgo.
# It imports products, categories and prices from 1C. The paid edition, which also exchanges stock
# and orders, is 1c-pro.yml. See example.yml for the fully-annotated template.
#
# `identifier` equals the provider's `static identifier`, which is how the catalog tells that the
# integration is installed.

identifier: "1c"
npm: "@gorgo/medusa-1c"
category: "erp"
author: "gorgo"
displayName:
  en: "1C:Enterprise Catalog"
  ru: "1С:Предприятие Каталог"
shortDescription:
  en: "Products, categories and prices from 1C:Enterprise ERP into Medusa"
  ru: "Товары, категории и цены из ERP 1С:Предприятие в Medusa"
icon: "1c.svg"
repository: "https://github.com/gorgojs/medusa-integrations"
docsUrl: "https://docs.gorgojs.com/medusa-integrations/1c-enterprise"
docsSnippet:
  en: |
    ## Install

    ```bash
    # with npm
    npm install @gorgo/medusa-1c@beta
    # or with yarn
    yarn add @gorgo/medusa-1c@beta
    # or with pnpm
    pnpm add @gorgo/medusa-1c@beta
    ```

    ## Use

    Add the following to your Medusa configuration:
    
    ```medusa-config.ts
    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo/medusa-1c/providers/integration-1c",
                id: "1c-1",
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo/medusa-1c",
          options: {},
        },
      ],
    })
    ```

    Then restart the server.

    ## Set up

    1. Open **Settings → Integrations → 1C:Enterprise Catalog**.
    2. Configure integration settings.
  ru: |
    ## Установка

    ```bash
    # with npm
    npm install @gorgo/medusa-1c@beta
    # or with yarn
    yarn add @gorgo/medusa-1c@beta
    # or with pnpm
    pnpm add @gorgo/medusa-1c@beta
    ```

    ## Подключение

    Добавьте следующий код в конфигурацию Medusa:

    ```medusa-config.ts
    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo/medusa-1c/providers/integration-1c",
                id: "1c-1",
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo/medusa-1c",
          options: {},
        },
      ],
    })
    ```

    Затем перезапустите сервер.

    ## Настройка

    1. Откройте **Настройки → Интеграции → 1С:Предприятие Каталог**.
    2. Настройте параметры интеграции.
active: true
