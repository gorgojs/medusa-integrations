# 1C:Enterprise — ERP data-exchange integration, authored by Gorgo.
# See example.yml for the fully-annotated template.
#
# NOTE: unlike tkassa/apiship/robokassa/yookassa, this ships as its own standalone Medusa
# plugin (registered under `plugins`, package "@gorgo/medusa-1c") rather than a provider plugged
# into a Medusa module's `options.providers` (under `modules`). `identifier` below is a
# catalog-only id (matches the npm scope / docs slug), not a provider `static identifier`.
# docsSnippet reflects that: it's a `plugins` entry, not a `modules` entry.

identifier: "1c"
npm: "@gorgo/medusa-1c"
category: "erp"
author: "gorgo"
displayName:
  en: "1C:Enterprise"
  ru: "1С:Предприятие"
shortDescription:
  en: "Data exchange between Medusa and 1C:Enterprise ERP"
  ru: "Обмен данными между Medusa и ERP 1С:Предприятие"
icon: "1c.svg"
repository: "https://github.com/gorgojs/medusa-integrations"
docsUrl: "https://docs.gorgojs.com/medusa-integrations/1c-enterprise"
docsSnippet:
  en: |
    ## Install

    ```bash
    # with npm
    npm install @gorgo/medusa-1c@beta
    # or with yarn
    yarn add @gorgo/medusa-1c@beta
    # or with pnpm
    pnpm add @gorgo/medusa-1c@beta
    ```

    ## Use

    Add the following to your Medusa configuration:
    
    ```medusa-config.ts
    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo/medusa-1c/providers/integration-1c",
                id: "1c-1",
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo/medusa-1c",
          options: {},
        },
      ],
    })
    ```

    Then restart the server.

    ## Set up

    1. Open **Settings → Integrations → 1C:Enterprise**.
    2. Configure integration settings.
  ru: |
    ## Установка

    ```bash
    # with npm
    npm install @gorgo/medusa-1c@beta
    # or with yarn
    yarn add @gorgo/medusa-1c@beta
    # or with pnpm
    pnpm add @gorgo/medusa-1c@beta
    ```

    ## Подключение

    Добавьте следующий код в конфигурацию Medusa:

    ```medusa-config.ts
    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo/medusa-1c/providers/integration-1c",
                id: "1c-1",
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo/medusa-1c",
          options: {},
        },
      ],
    })
    ```

    Затем перезапустите сервер.

    ## Настройка

    1. Откройте **Настройки → Интеграции → 1С:Предприятие**.
    2. Настройте параметры интеграции.
active: true
