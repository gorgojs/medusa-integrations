docsSnippet:
  en: |
    ## Install

    ```bash
    # with npm
    npm install @gorgo/medusa-payment-paypal
    # or with yarn
    yarn add @gorgo/medusa-payment-paypal
    # or with pnpm
    pnpm add @gorgo/medusa-payment-paypal
    ```

    ## Use

    Add the following to your Medusa configuration:

    ```medusa-config.ts
    const PAYPAL_INTEGRATION_ID = "paypal-1"

    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo/medusa-payment-paypal/providers/integration-paypal",
                id: PAYPAL_INTEGRATION_ID,
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo/medusa-payment-paypal",
          options: {},
        },
      ],
      modules: [
        {
          resolve: "@medusajs/medusa/payment",
          options: {
            providers: [
              {
                resolve: "@gorgo/medusa-payment-paypal/providers/payment-paypal",
                id: "paypal",
                options: { id: PAYPAL_INTEGRATION_ID },
              },
            ],
          },
        },
      ],
    })
    ```

    Then restart the server.

    ## Set up

    1. Open **Settings → Integrations → PayPal**.
    2. Configure integration settings.
  ru: |
