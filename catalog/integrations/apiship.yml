# ApiShip — multi-carrier shipping aggregation, authored by Gorgo.
# Minimal entry (no optional configSnippet). See example.yml for the fully-annotated template.

identifier: "apiship"
npm: "@gorgo/medusa-fulfillment-apiship"
category: "fulfillment"
author: "gorgo"
displayName:
  en: "ApiShip"
  ru: "ApiShip"
shortDescription:
  en: "Multi-carrier shipping aggregation via ApiShip"
  ru: "Агрегатор доставки по нескольким службам через ApiShip"
icon: "apiship.svg"
repository: "https://github.com/gorgojs/medusa-integrations"
docsUrl: "https://docs.gorgojs.com/integrations/apiship"
configSnippet: |
  // ...
  const APISHIP_INTEGRATION_ID = "apiship-1"

  module.exports = defineConfig({
    // ...
    plugins: [
      // ...
      {
        resolve: "@gorgo/medusa-integration",
        options: {
          encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
          providers: [
            {
              resolve: "@gorgo/medusa-fulfillment-apiship/providers/integration-apiship",
              id: APISHIP_INTEGRATION_ID,
              options: {},
            },
          ],
        },
      },
      {
        resolve: "@gorgo/medusa-fulfillment-apiship",
        options: {},
      },
    ],
    modules: [
      // ...
      {
        resolve: "@medusajs/medusa/fulfillment",
        options: {
          providers: [
            {
              resolve: "@gorgo/medusa-fulfillment-apiship/providers/fulfillment-apiship",
              id: "apiship",
              options: {
                id: APISHIP_INTEGRATION_ID
              },
            },
          ],
        },
      },
    ],
  })
active: true
