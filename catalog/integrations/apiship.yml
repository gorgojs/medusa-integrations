docsSnippet:
  en: |
    ## Install

    ```bash
    # with npm
    npm install @gorgo/medusa-fulfillment-apiship@beta
    # or with yarn
    yarn add @gorgo/medusa-fulfillment-apiship@beta
    # or with pnpm
    pnpm add @gorgo/medusa-fulfillment-apiship@beta
    ```

    ## Use

    Add the following to your Medusa configuration:

    ```medusa-config.ts
    const APISHIP_INTEGRATION_ID = "apiship-1"

    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo/medusa-fulfillment-apiship/providers/integration-apiship",
                id: APISHIP_INTEGRATION_ID,
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo/medusa-fulfillment-apiship",
          options: {},
        },
      ],
      modules: [
        {
          resolve: "@medusajs/medusa/fulfillment",
          options: {
            providers: [
              {
                resolve: "@gorgo/medusa-fulfillment-apiship/providers/fulfillment-apiship",
                id: "apiship",
                options: { id: APISHIP_INTEGRATION_ID },
              },
            ],
          },
        },
      ],
    })
    ```

    Then restart the server.

    ## Set up

    1. Open **Settings → Integrations → ApiShip**.
    2. Configure integration settings.
  ru: |
