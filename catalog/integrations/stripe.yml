docsSnippet:
  en: |
    ## Install

    ```bash
    # with npm
    npm install @gorgo/medusa-payment-stripe
    # or with yarn
    yarn add @gorgo/medusa-payment-stripe
    # or with pnpm
    pnpm add @gorgo/medusa-payment-stripe
    ```

    ## Use

    Add the following to your Medusa configuration:

    ```medusa-config.ts
    const STRIPE_INTEGRATION_ID = "stripe-1"

    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo/medusa-payment-stripe/providers/integration-stripe",
                id: STRIPE_INTEGRATION_ID,
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo/medusa-payment-stripe",
          options: {},
        },
      ],
      modules: [
        {
          resolve: "@medusajs/medusa/payment",
          options: {
            providers: [
              {
                resolve: "@gorgo/medusa-payment-stripe/providers/payment-stripe",
                id: "stripe",
                options: { id: STRIPE_INTEGRATION_ID },
              },
            ],
          },
        },
      ],
    })
    ```

    Then restart the server.

    ## Set up

    1. Open **Settings → Integrations → Stripe**.
    2. Configure integration settings.
  ru: |
