# 1C:Enterprise, the paid edition of the 1C:Enterprise integration, authored by Gorgo.
# It exchanges the catalog, prices, stock and orders. The free edition, 1C:Enterprise Catalog, is
# 1c.yml. See example.yml for the fully-annotated template.
#
# `identifier` equals the provider's `static identifier`, which is how the catalog tells that the
# integration is installed.

identifier: "1c-pro"
npm: "@gorgo-store/medusa-erp-1c"
category: "erp"
author: "gorgo"
displayName:
  en: "1C:Enterprise"
  ru: "1С:Предприятие"
shortDescription:
  en: "Two-way exchange of the catalog, prices, stock and orders between Medusa and 1C:Enterprise ERP"
  ru: "Двусторонний обмен каталогом, ценами, остатками и заказами между Medusa и ERP 1С:Предприятие"
icon: "1c.svg"
docsUrl: "https://docs.gorgojs.com/medusa-integrations/1c-pro"
docsSnippet:
  en: |
    ## Install

    ```bash
    # with npm
    npm install @gorgo-store/medusa-erp-1c@beta
    # or with yarn
    yarn add @gorgo-store/medusa-erp-1c@beta
    # or with pnpm
    pnpm add @gorgo-store/medusa-erp-1c@beta
    ```

    ## Use

    Add the following to your Medusa configuration:
    
    ```medusa-config.ts
    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo-store/medusa-erp-1c/providers/integration-1c",
                id: "1c-1",
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo-store/medusa-erp-1c",
          options: {},
        },
      ],
    })
    ```

    Then restart the server.

    ## Set up

    1. Open **Settings → Integrations → 1C:Enterprise**.
    2. Configure integration settings.
  ru: |
    ## Установка

    ```bash
    # with npm
    npm install @gorgo-store/medusa-erp-1c@beta
    # or with yarn
    yarn add @gorgo-store/medusa-erp-1c@beta
    # or with pnpm
    pnpm add @gorgo-store/medusa-erp-1c@beta
    ```

    ## Подключение

    Добавьте следующий код в конфигурацию Medusa:

    ```medusa-config.ts
    module.exports = defineConfig({
      plugins: [
        {
          resolve: "@gorgo/medusa-integration",
          options: {
            encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
            providers: [
              {
                resolve: "@gorgo-store/medusa-erp-1c/providers/integration-1c",
                id: "1c-1",
                options: {},
              },
            ],
          },
        },
        {
          resolve: "@gorgo-store/medusa-erp-1c",
          options: {},
        },
      ],
    })
    ```

    Затем перезапустите сервер.

    ## Настройка

    1. Откройте **Настройки → Интеграции → 1С:Предприятие**.
    2. Настройте параметры интеграции.
active: true
