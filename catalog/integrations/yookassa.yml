# YooKassa — payment provider, authored by Gorgo.
# See example.yml for the fully-annotated template.

identifier: "yookassa"
npm: "@gorgo/medusa-payment-yookassa"
category: "payment"
author: "gorgo"
displayName:
  en: "YooKassa"
  ru: "ЮKassa"
shortDescription:
  en: "Accept payments via YooKassa"
  ru: "Приём платежей через ЮKassa"
icon: "yookassa.svg"
repository: "https://github.com/gorgojs/medusa-integrations"
docsUrl: "https://docs.gorgojs.com/integrations/yookassa"
configSnippet: |
  // ...
  const YOOKASSA_INTEGRATION_ID = "yookassa-1"

  module.exports = defineConfig({
    // ...
    plugins: [
      // ...
      {
        resolve: "@gorgo/medusa-integration",
        options: {
          encryptionKey: process.env.INTEGRATION_ENCRYPTION_KEY,
          providers: [
            {
              resolve: "@gorgo/medusa-payment-yookassa/providers/integration-yookassa",
              id: YOOKASSA_INTEGRATION_ID,
              options: {},
            },
          ],
        },
      },
      {
        resolve: "@gorgo/medusa-payment-yookassa",
        options: {}
      },
    ],
    modules: [
      // ...
      {
        resolve: "@medusajs/medusa/payment",
        options: {
          providers: [
            {
              resolve: "@gorgo/medusa-payment-yookassa/providers/payment-yookassa",
              id: "yookassa",
              options: {
                id: YOOKASSA_INTEGRATION_ID
              }
            },
          ],
        },
      },
    ],
  })
active: true
