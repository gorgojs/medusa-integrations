name: Update Medusa Version

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  check_medusa_version:
    name: Check Medusa version increment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      should_update: ${{ steps.decide.outputs.should_update }}
      new_medusa_version: ${{ steps.versions.outputs.new_medusa_version }}
      current_versions: ${{ steps.versions.outputs.current_versions }}
      outdated_packages: ${{ steps.versions.outputs.outdated_packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Resolve version delta
        id: versions
        shell: bash
        run: |
          set -euo pipefail
          TARGET_VERSION="$(npm view @medusajs/medusa version)"
          export TARGET_VERSION
          node scripts/resolve-version-delta.js

      - name: Check for existing pull request
        id: pr_check
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          TARGET_VERSION="${{ steps.versions.outputs.new_medusa_version }}"
          BRANCH_NAME="chore/medusa-update-v${TARGET_VERSION}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          PR_COUNT=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${OWNER}/${REPO}/pulls?state=open&head=${OWNER}:${BRANCH_NAME}" \
            --jq 'length')

          OPEN_PR_EXISTS="false"
          if [ "$PR_COUNT" -gt 0 ] 2>/dev/null; then
            OPEN_PR_EXISTS="true"
          fi

          echo "open_pr_exists=${OPEN_PR_EXISTS}" >> "$GITHUB_OUTPUT"
          echo "Open PR for ${BRANCH_NAME}: ${OPEN_PR_EXISTS}"

      - name: Decide whether to update
        id: decide
        shell: bash
        run: |
          OUTDATED="${{ steps.versions.outputs.outdated_packages }}"
          OPEN_PR="${{ steps.pr_check.outputs.open_pr_exists }}"

          if [ -n "$OUTDATED" ] && [ "$OPEN_PR" != "true" ]; then
            echo "should_update=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_update=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Outdated packages: ${OUTDATED}"
          echo "Open PR exists: ${OPEN_PR}"
          echo "Should update: $(grep should_update "$GITHUB_OUTPUT" | tail -1)"

  update_test_and_pr:
    name: Update Medusa, run tests, create PR
    needs: check_medusa_version
    if: needs.check_medusa_version.outputs.should_update == 'true'
    runs-on: ubuntu-latest
    environment: test
    permissions:
      contents: write
      pull-requests: write
      issues: write

    services:
      postgres:
        image: public.ecr.aws/docker/library/postgres:16
        env:
          POSTGRES_USER: ${{ secrets.DB_USERNAME }}
          POSTGRES_PASSWORD: ${{ secrets.DB_PASSWORD }}
          POSTGRES_DB: ${{ secrets.DB_NAME }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      YARN_ENABLE_GLOBAL_CACHE: "false"
      YARN_CACHE_FOLDER: .yarn/cache
      DATABASE_URL: postgres://${{ secrets.DB_USERNAME }}:${{ secrets.DB_PASSWORD }}@localhost:5432/${{ secrets.DB_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Enable Corepack and Yarn
        run: |
          corepack enable
          corepack prepare yarn@4.9.2 --activate

      - name: Install root dependencies
        run: corepack yarn install --immutable

      - name: Tag telemetry machine_id as gorgo-ci
        run: |
          mkdir -p ~/.config/gorgo
          printf '{"notification_shown":true,"machine_id":"gorgo-ci"}\n' > ~/.config/gorgo/config.json

      - name: Inject environment secrets
        env:
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          echo "$SECRETS_JSON" | jq -r '
            to_entries[]
            | select(.value | type == "string")
            | "\(.key)<<__EOF_SECRET_\(.key)__\n\(.value)\n__EOF_SECRET_\(.key)__"
          ' >> "$GITHUB_ENV"

      - name: Trust Russian Trusted Root CA
        run: |
          CA="$PWD/.github/certs/russian-trusted-root-ca.pem"
          EXPECTED="D26D2D0231B7C39F92CC738512BA54103519E4405D68B5BD703E9788CA8ECF31"
          ACTUAL="$(openssl x509 -in "$CA" -noout -fingerprint -sha256 | cut -d= -f2 | tr -d ':')"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::Unexpected SHA-256 fingerprint for $CA: $ACTUAL"
            exit 1
          fi
          echo "NODE_EXTRA_CA_CERTS=$CA" >> "$GITHUB_ENV"

      - name: Update, test per plugin, and prepare results
        id: update
        shell: bash
        env:
          TARGET_VERSION: ${{ needs.check_medusa_version.outputs.new_medusa_version }}
          OUTDATED_PACKAGES: ${{ needs.check_medusa_version.outputs.outdated_packages }}
        run: bash scripts/test-and-bump.sh

      - name: Generate GitHub App token for PR
        id: app-token-pr
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Resolve GitHub App bot identity
        id: app-user
        env:
          GITHUB_TOKEN: ${{ steps.app-token-pr.outputs.token }}
          APP_SLUG: ${{ steps.app-token-pr.outputs.app-slug }}
        run: |
          set -euo pipefail
          USER_INFO="$(gh api "/users/${APP_SLUG}[bot]")"
          USER_ID="$(echo "$USER_INFO" | jq -r .id)"
          USER_LOGIN="$(echo "$USER_INFO" | jq -r .login)"
          echo "name=${USER_LOGIN}" >> "$GITHUB_OUTPUT"
          echo "email=${USER_ID}+${USER_LOGIN}@users.noreply.github.com" >> "$GITHUB_OUTPUT"

      - name: Create pull request
        id: cpr
        if: steps.update.outputs.has_passed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token-pr.outputs.token }}
          commit-message: "docs: test on Medusa v${{ needs.check_medusa_version.outputs.new_medusa_version }}"
          committer: "${{ steps.app-user.outputs.name }} <${{ steps.app-user.outputs.email }}>"
          author: "${{ steps.app-user.outputs.name }} <${{ steps.app-user.outputs.email }}>"
          title: "docs: test on Medusa v${{ needs.check_medusa_version.outputs.new_medusa_version }}"
          body: ${{ steps.update.outputs.pr_body }}
          branch: chore/medusa-update-v${{ needs.check_medusa_version.outputs.new_medusa_version }}
          delete-branch: true
          labels: |
            dependencies
            automation

      - name: Show pull request result
        if: always()
        run: |
          echo "PR number: ${{ steps.cpr.outputs.pull-request-number }}"
          echo "PR URL: ${{ steps.cpr.outputs.pull-request-url }}"
