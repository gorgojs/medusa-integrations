name: Publish Packages

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      prerelease:
        description: 'Publish a single package at its current version under a dist-tag, bypassing changesets'
        type: boolean
        default: false
      package:
        description: 'Workspace to publish when prerelease is true'
        type: string
        default: '@gorgo/medusa-integration'
      npm_tag:
        description: 'dist-tag for the prerelease'
        type: string
        default: 'beta'

jobs:
  publish:
    if: github.event_name != 'workflow_dispatch' || inputs.prerelease != true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      issues: write
      pull-requests: write
    concurrency:
      group: publish-packages-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      published: ${{ steps.changesets.outputs.published }}
      docs_changed: ${{ steps.docs.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect docs changes
        id: docs
        if: github.event_name == 'push'
        shell: bash
        run: |
          base='${{ github.event.before }}'
          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          files="$(git diff --name-only "$base" '${{ github.sha }}' 2>/dev/null || true)"
          if grep -q '^docs/' <<< "$files"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --immutable

      # Nothing built is committed and `yarn install` runs no workspace build
      # scripts, so the packages have to be compiled here: without dist/ and
      # .medusa/server/ the dependents cannot resolve each other's types.
      - name: Build packages
        run: |
          yarn workspace @gorgo/medusa-integration run catalog:gen
          yarn build

      - name: Generate changesets from conventional commits
        run: node scripts/generate-changesets.js
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Version and publish packages
        id: changesets
        uses: changesets/action@v1
        with:
          version: yarn release:version
          publish: yarn changeset publish
          title: 'chore: release packages'
          commit: 'chore: release packages'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          # Publish what the build step produced. `changeset publish` runs the
          # packages in parallel, so the integration module's prepublishOnly
          # wipes its own .medusa/server while yookassa is still type-checking
          # against it.
          npm_config_ignore_scripts: 'true'

  notify-docs:
    needs: publish
    if: needs.publish.outputs.published == 'true' || needs.publish.outputs.docs_changed == 'true'
    uses: ./.github/workflows/notify-deploy-docs.yml
    with:
      from_publish: true
    secrets: inherit

  publish-prerelease:
    if: github.event_name == 'workflow_dispatch' && inputs.prerelease == true
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    concurrency:
      group: publish-packages-${{ github.ref }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Refuse to prerelease from the default branch
        run: |
          if [ "${{ github.ref_name }}" = "${{ github.event.repository.default_branch }}" ]; then
            echo "prerelease publishes run from a feature branch, not ${{ github.ref_name }}" >&2
            exit 1
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.16.0
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build packages
        run: |
          yarn workspace @gorgo/medusa-integration run catalog:gen
          yarn build

      - name: Resolve the workspace and check it is a prerelease
        id: pkg
        env:
          TARGET: ${{ inputs.package }}
        run: |
          dir="$(yarn workspaces list --json | node -e '
            let out = ""
            process.stdin.on("data", (d) => { out += d })
            process.stdin.on("end", () => {
              const row = out.trim().split("\n").map((l) => JSON.parse(l)).find((w) => w.name === process.env.TARGET)
              if (!row) { console.error(`no such workspace: ${process.env.TARGET}`); process.exit(1) }
              process.stdout.write(row.location)
            })')"
          version="$(node -p "require('./${dir}/package.json').version")"
          case "$version" in
            *-*) ;;
            *) echo "refusing: ${version} is not a prerelease version" >&2; exit 1 ;;
          esac
          echo "publishing ${TARGET}@${version} from ${dir} as ${{ inputs.npm_tag }}"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Publish
        working-directory: ${{ steps.pkg.outputs.dir }}
        run: npm publish --tag '${{ inputs.npm_tag }}' --access public --ignore-scripts
